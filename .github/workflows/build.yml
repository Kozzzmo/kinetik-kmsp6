name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Optional signing secrets (Settings -> Secrets and variables -> Actions). Without them the builds are
# unsigned (ad-hoc on macOS) and everything else still works.
#   macOS : MACOS_CERTIFICATE (base64 .p12 with "Developer ID Application" + "Developer ID Installer"),
#           MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_APP ("Developer ID Application: Name (TEAMID)"),
#           MACOS_SIGN_INSTALLER ("Developer ID Installer: Name (TEAMID)"),
#           APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password, for notarization)
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   Updates: KINETIK_UPDATE_KEY (hex Ed25519 seed): signs dist/update.txt, which installed plugins read to offer
#            the new version. Without it no manifest is published and installed copies see no update.

jobs:
  macos:
    runs-on: macos-14
    env:
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and patch DPF
        run: ./scripts/setup.sh
      - name: "Build (universal: Apple Silicon + Intel)"
        run: make universal -j4
      - name: Sound regression (Apple clang, report only)
        run: |
          clang++ -O2 -std=c++17 tests/regress.cpp -o /tmp/regress-test
          /tmp/regress-test || echo "::warning::factory presets sound different with Apple clang (see the log)"
      - name: Import the Developer ID certificates
        if: env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/sign.keychain-db; KP=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC"
          security list-keychain -d user -s "$KC"
          rm $RUNNER_TEMP/cert.p12
      - name: Code signing
        env:
          MACOS_SIGN_APP: ${{ secrets.MACOS_SIGN_APP }}
        run: |
          for b in bin/*.vst3 bin/*.component bin/*.clap; do
            [ -e "$b" ] || continue
            if [ "$HAS_MAC_CERT" = "true" ]; then
              codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_APP" "$b"
            else
              codesign --force --deep --sign - "$b"
            fi
          done
          echo "::notice title=architectures::$(lipo -archs bin/KinetikKMSP6.vst3/Contents/MacOS/KinetikKMSP6)"
          echo "::notice title=signing::$([ "$HAS_MAC_CERT" = "true" ] && echo 'Developer ID' || echo 'ad-hoc (no certificate configured)')"
      - name: Validate the Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R bin/KinetikKMSP6.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          if auval -v aumu KM06 Kntk > auval.txt 2>&1; then
            echo "::notice title=auval::AU VALIDATION SUCCEEDED"
          else
            echo "::warning title=auval::$(tail -5 auval.txt | tr '\n' ' ')"
          fi
      - name: Installer package
        env:
          MACOS_SIGN_INSTALLER: ${{ secrets.MACOS_SIGN_INSTALLER }}
        run: |
          SIGN=""; [ "$HAS_MAC_CERT" = "true" ] && SIGN="$MACOS_SIGN_INSTALLER"
          sh packaging/macos/make-pkg.sh KinetikKMSP6 "Kinetik KMSP-6" audio.kinetik.kmsp6 "$(cat VERSION)" Kinetik-KMSP6-macOS.pkg "$SIGN"
      - name: Notarize
        if: env.HAS_MAC_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit Kinetik-KMSP6-macOS.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple Kinetik-KMSP6-macOS.pkg
          echo "::notice title=notarization::installer notarized and stapled"
      - name: Package
        run: |
          mkdir -p pkg
          cp -R bin/*.vst3 bin/*.component bin/*.clap pkg/ 2>/dev/null || true
          cp README.md EULA.txt THIRD_PARTY_NOTICES.txt pkg/
          cd pkg && zip -qry ../Kinetik-KMSP6-macOS.zip .
      - uses: actions/upload-artifact@v5
        with:
          name: Kinetik-KMSP6-macOS
          path: |
            Kinetik-KMSP6-macOS.zip
            Kinetik-KMSP6-macOS.pkg

  windows:
    runs-on: ubuntu-24.04
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      SIGN_DESCRIPTION: "Kinetik KMSP-6"
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW, NSIS and osslsigncode
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis osslsigncode
      - name: Fetch and patch DPF
        run: ./scripts/setup.sh
      - name: Build (Windows x64)
        run: make -j4 WINDOWS=true CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
      - name: Sign the plugins
        run: sh scripts/sign-windows.sh bin/KinetikKMSP6.vst3/Contents/x86_64-win/KinetikKMSP6.vst3 bin/KinetikKMSP6.clap
      - name: Installer
        run: |
          SIGNDEF=""; [ -n "$WINDOWS_CERTIFICATE" ] && SIGNDEF="-DSIGN"
          makensis -NOCD -V2 $SIGNDEF -DPRODUCT="Kinetik KMSP-6" -DBIN=KinetikKMSP6 -DVERSION=$(cat VERSION) -DOUTFILE=Kinetik-KMSP6-Windows-Setup.exe packaging/windows/installer.nsi
      - name: Package
        run: |
          mkdir -p pkg && cp -R bin/*.vst3 bin/*.clap pkg/ && cp README.md EULA.txt THIRD_PARTY_NOTICES.txt pkg/
          cd pkg && zip -qry ../Kinetik-KMSP6-Windows.zip .
      - uses: actions/upload-artifact@v5
        with:
          name: Kinetik-KMSP6-Windows
          path: |
            Kinetik-KMSP6-Windows.zip
            Kinetik-KMSP6-Windows-Setup.exe

  windows-install-test:
    # installs and uninstalls the real installer on Windows
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Kinetik-KMSP6-Windows
      - name: Update while a host has the plug-in loaded
        shell: pwsh
        run: |
          $setup = (Get-Item .\Kinetik-KMSP6-Windows-Setup.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $vst = "$env:CommonProgramFiles\VST3\KinetikKMSP6.vst3\Contents\x86_64-win\KinetikKMSP6.vst3"
          Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern IntPtr LoadLibraryW(string p);'
          $h = [W.K]::LoadLibraryW($vst)
          if ($h -eq [IntPtr]::Zero) { Write-Error "could not load the installed plug-in"; exit 1 }
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "silent update over a loaded plug-in failed (exit $($p.ExitCode))"; exit 1 }
          if (!(Test-Path $vst)) { Write-Error "plug-in missing after the update"; exit 1 }
          if (!(Get-ChildItem "$(Split-Path $vst)\*.old")) { Write-Error "the loaded plug-in was not moved aside"; exit 1 }
          echo "::notice title=installer::silent update while the plug-in is loaded OK"
      - name: Silent install, check, uninstall
        shell: pwsh
        run: |
          Start-Process -FilePath .\Kinetik-KMSP6-Windows-Setup.exe -ArgumentList '/S' -Wait
          $vst = "$env:CommonProgramFiles\VST3\KinetikKMSP6.vst3\Contents\x86_64-win\KinetikKMSP6.vst3"
          $clap = "$env:CommonProgramFiles\CLAP\KinetikKMSP6.clap"
          if (!(Test-Path $vst) -or !(Test-Path $clap)) { Write-Error "plugin files missing after install"; exit 1 }
          $un = "$env:ProgramFiles\Kinetik\KinetikKMSP6\Uninstall.exe"
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if ((Test-Path $vst) -or (Test-Path $clap)) { Write-Error "plugin files left after uninstall"; exit 1 }
          echo "::notice title=installer::install and uninstall OK"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev libjack-jackd2-dev pkg-config
      - name: Fetch and patch DPF
        run: ./scripts/setup.sh
      - name: Build
        run: make -j4
      - name: Run tests
        run: |
          gcc -O2 -c src/third_party/monocypher/monocypher.c -o /tmp/m1.o
          gcc -O2 -c src/third_party/monocypher/monocypher-ed25519.c -o /tmp/m2.o
          g++ -O2 -std=c++17 -Isrc tests/license.cpp /tmp/m1.o /tmp/m2.o -o /tmp/license-test && /tmp/license-test
          g++ -O2 -std=c++17 -Isrc tests/update.cpp /tmp/m1.o /tmp/m2.o -o /tmp/update-test && /tmp/update-test
          g++ -O2 -std=c++17 tests/presets.cpp -o /tmp/presets-test && mkdir -p out && /tmp/presets-test > /dev/null
          g++ -O2 -std=c++17 tests/features.cpp -o /tmp/features-test && /tmp/features-test
          g++ -O2 -std=c++17 tests/regress.cpp -o /tmp/regress-test && /tmp/regress-test   # sound of every factory preset
          g++ -O2 -std=c++17 tests/speed.cpp -o /tmp/speed-test && /tmp/speed-test          # per-track SPEED
          g++ -O2 -std=c++17 tests/morph.cpp -o /tmp/morph-test && /tmp/morph-test          # scenes, LFO -> MORPH, CHAOS sends
          g++ -O2 -std=c++17 tests/echo.cpp -o /tmp/echo-test && /tmp/echo-test             # echo models, R TIME / DRIVE / DUCK / FREEZE
          g++ -O2 -std=c++17 -pthread tests/wavetable.cpp -o /tmp/wt-test && /tmp/wt-test     # wavetables, user tables
          ./scripts/check-shared.sh                                                  # files shared with the sister plug-in
      - name: Package
        run: |
          mkdir -p pkg && cp -R bin/*.vst3 bin/*.clap pkg/ && cp README.md EULA.txt THIRD_PARTY_NOTICES.txt pkg/
          cd pkg && zip -qry ../Kinetik-KMSP6-Linux.zip .
      - uses: actions/upload-artifact@v5
        with:
          name: Kinetik-KMSP6-Linux
          path: Kinetik-KMSP6-Linux.zip

  release:
    # every push to main publishes (or refreshes) the release named after the VERSION file
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows, windows-install-test, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: ver
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Signed update manifest
        env:
          KINETIK_UPDATE_KEY: ${{ secrets.KINETIK_UPDATE_KEY }}
        run: |
          if [ -z "$KINETIK_UPDATE_KEY" ]; then echo "::warning title=updates::KINETIK_UPDATE_KEY not set, no update.txt published"; exit 0; fi
          pip install --quiet cryptography
          python3 tools/sign_update.py --product KMSP-6 --version ${{ steps.ver.outputs.v }} --repo kinetik-kmsp6 \
            --mac dist/Kinetik-KMSP6-macOS.pkg --win dist/Kinetik-KMSP6-Windows-Setup.exe \
            --changelog CHANGELOG.md --out dist/update.txt
          cat dist/update.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.zip
            dist/*.pkg
            dist/*.exe
            dist/update.txt
          generate_release_notes: false
          body: |
            Installers: Kinetik-KMSP6-macOS.pkg (macOS universal, VST3 + AU + CLAP) and Kinetik-KMSP6-Windows-Setup.exe (Windows 64-bit, VST3 + CLAP).
            The zips contain the same plugins for manual installation (and the Linux build).
            Installed copies (0.9 and later for KDSP-16, 0.4 and later for KMSP-6) offer new versions themselves: click the logo.
