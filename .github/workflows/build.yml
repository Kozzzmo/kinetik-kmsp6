name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Fetch and patch DPF
        run: ./scripts/setup.sh
      - name: "Build (universal: Apple Silicon + Intel)"
        run: make universal -j4
      - name: Ad-hoc code signing
        run: |
          for b in bin/*.vst3 bin/*.component bin/*.clap; do
            [ -e "$b" ] && codesign --force --deep --sign - "$b"
          done
          echo "::notice title=architectures::$(lipo -archs bin/KinetikKMSP6.vst3/Contents/MacOS/KinetikKMSP6)"
      - name: Validate the Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R bin/KinetikKMSP6.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i kinetik || true
          if auval -v aumu KM06 Kntk > auval.txt 2>&1; then
            echo "::notice title=auval::AU VALIDATION SUCCEEDED"
          else
            echo "::warning title=auval::$(tail -5 auval.txt | tr '\n' ' ')"
          fi
      - name: Package
        run: |
          mkdir -p pkg
          cp -R bin/*.vst3 bin/*.component bin/*.clap pkg/ 2>/dev/null || true
          cp README.md pkg/
          cd pkg && zip -qry ../Kinetik-KMSP6-macOS.zip .
      - uses: actions/upload-artifact@v5
        with:
          name: Kinetik-KMSP6-macOS
          path: Kinetik-KMSP6-macOS.zip

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Fetch and patch DPF
        run: ./scripts/setup.sh
      - name: Build (Windows x64)
        run: make -j4 WINDOWS=true CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++
      - name: Package
        run: |
          mkdir -p pkg && cp -R bin/*.vst3 bin/*.clap pkg/ && cp README.md pkg/
          cd pkg && zip -qry ../Kinetik-KMSP6-Windows.zip .
      - uses: actions/upload-artifact@v5
        with:
          name: Kinetik-KMSP6-Windows
          path: Kinetik-KMSP6-Windows.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libdbus-1-dev libjack-jackd2-dev pkg-config
      - name: Fetch and patch DPF
        run: ./scripts/setup.sh
      - name: Build
        run: make -j4
      - name: Package
        run: |
          mkdir -p pkg && cp -R bin/*.vst3 bin/*.clap pkg/ && cp README.md pkg/
          cd pkg && zip -qry ../Kinetik-KMSP6-Linux.zip .
      - uses: actions/upload-artifact@v5
        with:
          name: Kinetik-KMSP6-Linux
          path: Kinetik-KMSP6-Linux.zip

  release:
    # every push to main publishes (or refreshes) the release named after the VERSION file
    if: github.ref == 'refs/heads/main'
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: ver
        run: echo "v=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.zip
          generate_release_notes: false
          body: |
            Download the zip for your system below (Assets).
            macOS: universal (Apple Silicon + Intel), VST3 + AU + CLAP. Installation steps in the README.
            Windows: VST3 + CLAP (64-bit). Linux: VST3 + CLAP.
